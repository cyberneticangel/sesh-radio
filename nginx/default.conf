server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the stream through the same origin so the Web Audio
    # visualizer can read samples without CORS issues.
    location = /stream {
        proxy_pass http://icecast:8000/sesh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location = /status-json.xsl {
        proxy_pass http://icecast:8000/status-json.xsl;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }
}
